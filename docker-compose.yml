services:

  # ── Development ─────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:4.2.4-management-alpine
    profiles: [dev]
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles: [dev]
    volumes:
      # Hot-reload: mount source so code changes reflect immediately
      - ./app:/app/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles: [dev]
    command: ["python", "-m", "app.worker"]
    volumes:
      # Hot-reload: mount source so code changes reflect immediately
      - ./app:/app/app
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/worker.heartbeat -mmin -1 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ── Production ──────────────────────────────────────────────────────────────
  web-prod:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [prod]
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
